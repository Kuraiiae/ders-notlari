<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c5cff'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<title>Sayfa bulunamadı · KPSS Orta Öğretim</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#070a16;--panel:rgba(255,255,255,.06);--stroke:rgba(255,255,255,.12);--text:#e9efff;--muted:#8f9dc0;--accent:#7c5cff;--accent-2:#2ec4b6}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--text);
  font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;text-align:center;padding:24px}
.card{max-width:520px;padding:44px 36px;border-radius:24px;border:1px solid var(--stroke);background:var(--panel)}
.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;font-size:30px;color:#fff;
  background:linear-gradient(140deg,var(--accent),var(--accent-2))}
h1{font-size:26px;margin:0 0 10px}
p{color:var(--muted);line-height:1.7;margin:0 0 24px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:700;font-size:14px;
  border:1px solid var(--stroke);color:var(--text)}
a.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
</style>
</head>
<body>
<main class="card">
  <div class="mark">&#128214;</div>
  <h1>Aradığın sayfa defterde yok</h1>
  <p>Bağlantı değişmiş ya da yazım hatası olabilir. Kitap Modu'na dönüp kaldığın yerden devam edebilirsin.</p>
  <div class="row">
    <a class="btn primary" href="oku.html">&#128214; Kitap Modu'na dön</a>
    <a class="btn" href="index.html">Galeri görünümü</a>
  </div>
</main>
</body>
</html>
