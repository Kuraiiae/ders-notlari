<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 UniNote — KPSS Orta Öğretim</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07071a;--surface:rgba(255,255,255,.04);--surface-h:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.09);--border-h:rgba(255,255,255,.18);
  --accent:#7c6dfa;--accent2:#fa6d9a;--accent3:#43d4ac;
  --text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.42);--dim:rgba(255,255,255,.20);
  --dur:680ms;--ease:cubic-bezier(0.16,1,0.3,1);--sw:272px;--th:54px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
.bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 65% 55% at 15% 50%,rgba(124,109,250,.15) 0%,transparent 65%),
    radial-gradient(ellipse 50% 45% at 85% 20%,rgba(250,109,154,.10) 0%,transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 85%,rgba(67,212,172,.07) 0%,transparent 55%),#07071a;
  animation:bgHue 20s ease-in-out infinite alternate}
@keyframes bgHue{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(28deg)}}
.grid{position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.013) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.013) 1px,transparent 1px);background-size:52px 52px}
.particles{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.p{position:absolute;border-radius:50%;animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(110vh) rotate(0deg) scale(0);opacity:0}
  8%{opacity:.7;transform:translateY(90vh) scale(1)}92%{opacity:.4}
  100%{transform:translateY(-6vh) rotate(540deg) scale(.25);opacity:0}}
.flash{position:fixed;inset:0;z-index:500;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(124,109,250,.20),transparent 68%);opacity:0;transition:opacity .1s}
.flash.on{opacity:1}
.pill{position:fixed;bottom:18px;left:calc(var(--sw) + 50%);transform:translateX(-50%) translateY(70px);
  z-index:400;background:rgba(7,7,26,.88);backdrop-filter:blur(18px);border:1px solid var(--border);
  border-radius:99px;padding:6px 16px;font-size:11.5px;color:var(--muted);
  display:flex;align-items:center;gap:7px;transition:transform .4s var(--ease),opacity .4s;opacity:0}
.pill.show{transform:translateX(-50%) translateY(0);opacity:1}
.pill-dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:pd .8s ease-in-out infinite}
@keyframes pd{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.45);opacity:.3}}
.ep{position:fixed;top:calc(var(--th) + 8px);right:16px;z-index:300;
  background:rgba(7,7,26,.92);backdrop-filter:blur(20px);border:1px solid var(--border);
  border-radius:14px;padding:12px;min-width:165px;display:none;flex-direction:column;gap:4px;
  box-shadow:0 24px 64px rgba(0,0,0,.65)}
.ep.open{display:flex}
.ep-title{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;padding:0 4px}
.ep-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;
  font-size:12.5px;color:var(--muted);transition:all .2s;border:1px solid transparent}
.ep-opt:hover{background:var(--surface-h);color:var(--text)}
.ep-opt.sel{background:rgba(124,109,250,.15);border-color:rgba(124,109,250,.3);color:var(--text)}
.dots{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:200;display:flex;flex-direction:column;gap:5px}
.nd{width:5px;height:5px;border-radius:99px;background:rgba(255,255,255,.16);cursor:pointer;transition:all .35s var(--ease)}
.nd:hover{background:rgba(255,255,255,.5);transform:scaleX(2.2)}
.nd.active{background:var(--accent);height:18px;box-shadow:0 0 12px var(--accent)}
.layout{position:relative;z-index:10;display:flex;height:100vh}
.sidebar{width:var(--sw);height:100vh;flex-shrink:0;display:flex;flex-direction:column;
  background:rgba(7,7,26,.78);backdrop-filter:blur(28px) saturate(170%);
  border-right:1px solid var(--border);position:relative;overflow:hidden}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3),var(--accent));
  background-size:200% 100%;animation:grad 3.5s linear infinite}
@keyframes grad{0%{background-position:0% 0%}100%{background-position:200% 0%}}
.sidebar::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 35% at 50% 0%,rgba(124,109,250,.07),transparent 60%)}
.sb-head{padding:22px 18px 16px;border-bottom:1px solid var(--border);position:relative;z-index:1}
.logo-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo-box{width:42px;height:42px;border-radius:13px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 4px 20px rgba(124,109,250,.45),0 0 0 1px rgba(255,255,255,.10);
  animation:lGlow 3s ease-in-out infinite alternate}
@keyframes lGlow{0%{box-shadow:0 4px 20px rgba(124,109,250,.45),0 0 0 1px rgba(255,255,255,.10)}
  100%{box-shadow:0 4px 32px rgba(250,109,154,.55),0 0 0 1px rgba(255,255,255,.15)}}
.logo-name{font-size:17px;font-weight:800;letter-spacing:-.3px;
  background:linear-gradient(135deg,#fff 30%,rgba(255,255,255,.55));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:10px;color:var(--muted);margin-top:2px;font-weight:400;letter-spacing:.3px}
.srch{position:relative}
.srch input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);
  border-radius:10px;padding:8px 10px 8px 32px;color:var(--text);font-size:12.5px;
  font-family:inherit;outline:none;transition:all .25s}
.srch input::placeholder{color:var(--muted)}
.srch input:focus{border-color:var(--accent);background:rgba(124,109,250,.10);
  box-shadow:0 0 0 3px rgba(124,109,250,.12)}
.srch-ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.pg-list{flex:1;overflow-y:auto;padding:8px 10px;scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.07) transparent;position:relative;z-index:1}
.pg-list::-webkit-scrollbar{width:3px}
.pg-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:99px}
.pi{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer;
  transition:all .2s;margin-bottom:1px;border:1px solid transparent}
.pi:hover{background:var(--surface-h);border-color:var(--border)}
.pi.active{background:rgba(124,109,250,.14);border-color:rgba(124,109,250,.32)}
.pi-num{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
  flex-shrink:0;color:var(--muted);transition:all .2s}
.pi.active .pi-num{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 2px 8px rgba(124,109,250,.45)}
.pi-ttl{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;transition:color .2s;line-height:1.3}
.pi.active .pi-ttl,.pi:hover .pi-ttl{color:var(--text)}
.sb-foot{padding:14px 18px;border-top:1px solid var(--border);position:relative;z-index:1}
.prog-track{height:3px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-bottom:7px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .5s var(--ease)}
.prog-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.main{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;min-width:0}
.tb{height:var(--th);background:rgba(7,7,26,.72);backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  padding:0 22px;gap:14px;flex-shrink:0;position:relative;z-index:50}
.tb-num{display:flex;align-items:baseline;gap:4px;font-size:12px;color:var(--muted)}
.tb-cur{font-size:22px;font-weight:800;line-height:1;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sep{width:1px;height:22px;background:var(--border)}
.tb-ttl{font-size:12.5px;color:var(--muted);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tb-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.ib{width:32px;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:all .2s}
.ib:hover{background:var(--surface-h);border-color:var(--border-h);transform:translateY(-1px)}
.ib:active{transform:scale(.9)}
.kbd-h{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.kbd{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:5px;
  padding:1px 6px;font-size:10px;font-family:monospace;color:var(--muted)}
.eff-badge{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:4px 10px;font-size:11.5px;color:var(--muted);cursor:pointer;transition:all .2s}
.eff-badge:hover{background:var(--surface-h);color:var(--text)}
.eff-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;perspective:1100px}
.stage::before{content:'';position:absolute;width:700px;height:700px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(124,109,250,.05) 0%,transparent 68%);pointer-events:none;z-index:0}
.frame-shell{position:absolute;display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;will-change:transform,opacity,filter;z-index:10}
.pg-card{width:min(900px,calc(100vw - var(--sw) - 50px));height:calc(100vh - var(--th) - 38px);
  max-height:1080px;border:none;border-radius:18px;background:#fff;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 4px 6px rgba(0,0,0,.35),
    0 24px 64px rgba(0,0,0,.52),0 64px 128px rgba(0,0,0,.28),0 0 90px rgba(124,109,250,.07)}
/* gorsel setler: sayfa gorseli kart icinde oranli yerlestirilir */
.pg-card.pg-img{background:transparent;box-shadow:none;display:flex;align-items:center;justify-content:center}
.pg-card.pg-img img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:18px;background:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 4px 6px rgba(0,0,0,.35),0 24px 64px rgba(0,0,0,.52),
    0 0 90px rgba(124,109,250,.07)}
/* SLIDE */
.e-sd-dn{animation:eSdDn var(--dur) var(--ease) both}
.e-sd-up{animation:eSdUp var(--dur) var(--ease) both}
.l-sd-up{animation:lSdUp var(--dur) var(--ease) both}
.l-sd-dn{animation:lSdDn var(--dur) var(--ease) both}
@keyframes eSdDn{from{transform:translateY(105%) scale(.90);opacity:0;filter:blur(14px)}to{transform:translateY(0) scale(1);opacity:1;filter:blur(0)}}
@keyframes eSdUp{from{transform:translateY(-105%) scale(.90);opacity:0;filter:blur(14px)}to{transform:translateY(0) scale(1);opacity:1;filter:blur(0)}}
@keyframes lSdUp{from{transform:translateY(0) scale(1);opacity:1;filter:blur(0)}to{transform:translateY(-105%) scale(.90);opacity:0;filter:blur(14px)}}
@keyframes lSdDn{from{transform:translateY(0) scale(1);opacity:1;filter:blur(0)}to{transform:translateY(105%) scale(.90);opacity:0;filter:blur(14px)}}
/* ZOOM */
.e-zm{animation:eZm var(--dur) var(--ease) both}
.l-zm{animation:lZm var(--dur) var(--ease) both}
@keyframes eZm{from{transform:scale(.72);opacity:0;filter:blur(18px)}to{transform:scale(1);opacity:1;filter:blur(0)}}
@keyframes lZm{from{transform:scale(1);opacity:1;filter:blur(0)}to{transform:scale(1.12);opacity:0;filter:blur(18px)}}
/* FLIP */
.e-fl{animation:eFl var(--dur) var(--ease) both}
.l-fl{animation:lFl var(--dur) var(--ease) both}
@keyframes eFl{from{transform:rotateY(-22deg) translateX(10%) scale(.86);opacity:0;filter:blur(8px)}to{transform:rotateY(0) translateX(0) scale(1);opacity:1;filter:blur(0)}}
@keyframes lFl{from{transform:rotateY(0) translateX(0) scale(1);opacity:1;filter:blur(0)}to{transform:rotateY(22deg) translateX(-10%) scale(.86);opacity:0;filter:blur(8px)}}
/* CUBE */
.e-cb{animation:eCb var(--dur) var(--ease) both}
.l-cb{animation:lCb var(--dur) var(--ease) both}
@keyframes eCb{from{transform:perspective(1000px) rotateX(-24deg) translateY(70px) scale(.90);opacity:0}to{transform:perspective(1000px) rotateX(0) translateY(0) scale(1);opacity:1}}
@keyframes lCb{from{transform:perspective(1000px) rotateX(0) translateY(0) scale(1);opacity:1}to{transform:perspective(1000px) rotateX(24deg) translateY(-70px) scale(.90);opacity:0}}
/* SWIRL */
.e-sw{animation:eSw var(--dur) var(--ease) both}
.l-sw{animation:lSw var(--dur) var(--ease) both}
@keyframes eSw{from{transform:rotate(-8deg) scale(.8) translateY(6%);opacity:0;filter:blur(12px)}to{transform:rotate(0) scale(1) translateY(0);opacity:1;filter:blur(0)}}
@keyframes lSw{from{transform:rotate(0) scale(1) translateY(0);opacity:1;filter:blur(0)}to{transform:rotate(8deg) scale(.8) translateY(-6%);opacity:0;filter:blur(12px)}}

/* ── AŞAĞI BUTONU (BOTTOM DOWN NAVIGATION BAR) ── */
.bottom-down-bar {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 24px;
  border-radius: 99px;
  background: rgba(12, 14, 34, 0.88);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(124, 109, 250, 0.35);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 24px rgba(124, 109, 250, 0.25);
  cursor: pointer;
  transition: all 0.28s var(--ease);
  color: #fff;
  user-select: none;
}
.bottom-down-bar:hover {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-color: transparent;
  transform: translateX(-50%) translateY(-3px) scale(1.03);
  box-shadow: 0 14px 38px rgba(124, 109, 250, 0.55);
}
.bottom-down-bar:active {
  transform: translateX(-50%) translateY(0) scale(0.97);
}
.down-icon {
  font-size: 16px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: downBounce 1.4s ease-in-out infinite;
}
@keyframes downBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(4px); }
}
.down-text {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.down-next-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.15);
  color: rgba(255, 255, 255, 0.95);
  font-weight: 600;
}
.dock{position:fixed;bottom:20px;right:24px;z-index:100;display:flex;align-items:center;gap:6px;background:rgba(7,7,26,.88);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:4px 8px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.dock-b{width:36px;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.dock-b:hover{background:rgba(124,109,250,.25);border-color:var(--accent);color:#fff;transform:translateY(-2px)}
/* ── TEST MODU (A–E) ────────────────────────────────────────────────
   Sag cekmece: sayfadaki sorular kart olarak akar, her sorunun A–E
   dugmeleri vardir. Isaretler `oku.quiz.<set>` anahtarinda saklanir;
   Kitap Modu ve Galeri ile ayni ilerleme paylasilir. Cevap anahtari
   yalnizca "Anahtari goster" / "Denemeyi bitir" sonrasi gorunur. */
.qz-open-btn{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:4px 10px;font-size:11.5px;color:var(--muted);cursor:pointer;transition:all .2s}
.qz-open-btn:hover{background:var(--surface-h);color:var(--text);border-color:var(--border-h)}
.qz-open-btn b{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:99px;
  padding:1px 7px;font-size:10.5px;font-weight:800}
/* sayfada soru yokken test dugmesi gizli kalir */
#qzToggle[hidden]{display:none!important}
.qz-drawer{position:fixed;top:var(--th);right:0;bottom:0;width:min(400px,94vw);z-index:210;
  display:flex;flex-direction:column;background:rgba(7,7,26,.94);backdrop-filter:blur(26px);
  border-left:1px solid var(--border);box-shadow:-18px 0 60px rgba(0,0,0,.5);
  transform:translateX(104%);opacity:0;transition:transform .42s var(--ease),opacity .3s}
body.qz-open .qz-drawer{transform:none;opacity:1}
body.qz-open .dots{right:calc(min(400px,94vw) + 16px)}
.qz-head{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.qz-head .t{font-size:12.5px;font-weight:800}
.qz-head .c{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.qz-head .c b{color:var(--accent)}
.qz-sp{flex:1}
.qz-chip{background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text);
  font-size:11.5px;font-weight:700;padding:6px 11px;cursor:pointer;transition:all .2s;font-family:inherit}
.qz-chip:hover{background:var(--surface-h);border-color:var(--border-h)}
.qz-chip.key{border-color:rgba(247,201,72,.45);color:#f7c948}
.qz-chip.finish{background:#16a34a;border-color:#16a34a;color:#fff}
.qz-chip.finish:hover{background:#15803d}
.qz-cards{flex:1;overflow-y:auto;padding:12px 14px 24px;display:flex;flex-direction:column;gap:10px}
.qz-none{color:var(--muted);font-size:12.5px;line-height:1.7;padding:6px 2px}
.qcard{border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.qcard.done{border-color:rgba(67,212,172,.55)}
.qcard .qh{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;font-weight:800}
.qcard .qh .qn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:8px;
  min-width:30px;height:26px;display:inline-grid;place-items:center;font-size:12.5px;padding:0 8px}
.qcard .qh .sp{font-size:10.5px;color:var(--muted);font-weight:600}
.qcard .qh .tick{margin-left:auto;display:none;color:#43d4ac;font-size:19px;font-weight:900}
.qcard.done .qh .tick{display:inline}
.qcard .qh .tick.bad{color:#ef2b3a}
.qcard .qh .tick.bos{color:var(--muted);font-size:15px}
.qcard .qk{padding:0 12px 8px;font-size:12.5px;line-height:1.7;color:var(--text);white-space:pre-wrap}
.qcard .qk.bos{color:var(--muted);font-style:italic}
.qcard .qo{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px;position:relative;z-index:4}
.qcard .qo button{flex:1 1 52px;min-width:52px;min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--text);font-size:15px;font-weight:800;cursor:pointer;
  font-family:inherit;transition:all .18s;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;pointer-events:auto}
.qcard .qo button:hover{border-color:var(--accent)}
.qcard .qo button.sel{background:#ef2b3a;border-color:#ef2b3a;color:#fff;box-shadow:0 0 0 3px rgba(239,43,58,.25)}
.qcard .qo button.ok{background:#16a34a;border-color:#16a34a;color:#fff}
.qcard .qo button.bad{background:#ef2b3a;border-color:#ef2b3a;color:#fff}
.qcard .qo button.dim{opacity:.55}

  padding:9px 12px;font-size:12px;line-height:1.95;color:var(--text);display:none}
.qz-key.on{display:block}
.qz-key .kk{font-weight:800;color:#f7c948}
/* set secimi (sol panel) */
.sb-set{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.sb-set-b{background:var(--surface);border:1px solid var(--border);border-radius:99px;color:var(--muted);
  font-size:10.5px;font-weight:700;padding:3px 9px;cursor:pointer;transition:all .2s;font-family:inherit}
.sb-set-b:hover{color:var(--text);border-color:var(--border-h)}
.sb-set-b.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
/* modlar arasi gecis: Kitap (oku.html) / Galeri / Ana sayfa */
.sb-links{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.sb-link{background:var(--surface);border:1px solid var(--border);border-radius:99px;color:var(--muted);
  font-size:10.5px;font-weight:700;padding:4px 10px;text-decoration:none;transition:all .2s}
.sb-link:hover{color:var(--text);border-color:var(--border-h)}
/* sonuc penceresi: "Denemeyi bitir" sonrasi puanlama + anahtar dokumu */
.qz-modal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(3,6,18,.7);backdrop-filter:blur(6px)}
.qz-modal.open{display:flex}
.qz-card{width:min(560px,100%);max-height:86vh;overflow:auto;border-radius:20px;padding:20px;
  border:1px solid var(--border);background:rgba(12,14,34,.98);box-shadow:0 30px 90px rgba(0,0,0,.6)}
.qz-card h3{margin:0 0 4px;font-size:18px}
.qz-card .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.qz-card .ad{margin:0 0 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;font-size:13px}
.qz-card .ad .hd{padding:8px 12px;font-weight:800;font-size:12.5px;border-bottom:1px solid var(--border)}
.qz-card .gv,.qz-card .gr{display:grid;grid-template-columns:38px 1fr 1fr 1fr 1.4fr;align-items:center;gap:6px;padding:6px 12px}
.qz-card .gv{color:var(--muted);font-size:11px;font-weight:700}
.qz-card .gr{border-top:1px solid rgba(255,255,255,.07)}
.qz-card .gr .gk{font-weight:800;color:var(--accent);text-align:center}

.qz-card .gr .gc.okc{color:#43d4ac}
.qz-card .gr .gc.badc{color:#ef2b3a}
.qz-card .gr .gz{font-size:11.5px;font-weight:700;color:var(--muted)}
.qz-card .gr.off{opacity:.45}
.qz-card .gr.sum{background:rgba(255,255,255,.05);border-top:2px solid var(--border)}
.qz-card .row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13.5px;cursor:pointer}
.qz-card .row:hover{background:rgba(124,109,250,.14)}
.qz-card .row:nth-child(odd){background:rgba(255,255,255,.04)}
.qz-card .row .n{font-weight:800;min-width:52px;color:var(--muted)}
.qz-card .row .a{font-weight:800;min-width:50px;text-align:center;border-radius:8px;padding:2px 8px;
  background:rgba(239,43,58,.14);color:#ef2b3a}
.qz-card .row .go{margin-left:auto;font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap}
.qz-card .row b.okc{color:#43d4ac}
.qz-card .row b.badc{color:#ef2b3a}

/* dar ekran: cekmece alttan acilir */
@media (max-width:760px){
  .qz-drawer{width:100vw;top:auto;height:min(72vh,580px);border-left:0;border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;transform:translateY(104%)}
  body.qz-open .qz-drawer{transform:none}
  body.qz-open .dots{display:none}
  .qz-cards{padding:10px 10px 20px}
}

<body>

  <div class="ep-title">Geçiş Efekti</div>
  <div class="ep-opt sel" onclick="pickEff('slide',this)">↕ Dikey Kayma</div>
  <div class="ep-opt"     onclick="pickEff('zoom',this)">◎ Zoom Solma</div>
  <div class="ep-opt"     onclick="pickEff('flip',this)">↔ 3D Çevirme</div>
  <div class="ep-opt"     onclick="pickEff('cube',this)">⬡ Küp Geçiş</div>
  <div class="ep-opt"     onclick="pickEff('swirl',this)">🌀 Girdap</div>
  <div class="ep-opt"     onclick="pickEff('random',this)">🎲 Rastgele</div>
</div>
<div class="dots" id="dots"></div>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="logo-row">
        <div class="logo-box">📚</div>

      </div>
      <div class="srch">

  <main class="main">

      <div class="tb-r">
        <button class="qz-open-btn" id="qzToggle" hidden title="Test modu: soruyu işaretle (T)">

</div>

    <span class="qz-sp"></span>
    <button class="qz-chip key" id="qzKeyBtn" title="Bu sayfanın cevap anahtarını göster (A)">Anahtarı göster</button>

</aside>

  <div class="qz-card">
    <h3 id="qzTitle">Sonuç</h3>

      <button class="qz-chip finish" id="qzModalClose">Kapat</button>
      <button class="qz-chip" id="qzModalReset">İşaretleri temizle</button>
    </div>
  </div>
</div>
<div class="dock">
  <button class="dock-b" onclick="go(-1)" title="Önceki Sayfa">↑</button>
  <button class="dock-b" onclick="go(1)" title="Sonraki Sayfa">↓</button>
</div>
<script>
const DUR=700,THR=72;
/* Setler: tarih sayfalari HTML (page_N.html, iframe) olarak, diger setler
   assets/<set>/page-NNN.jpg gorseli olarak gosterilir — Kitap Modu ve Galeri
   ile ayni kaynak. Test modu (A–E) her sette ayni sekilde calisir.
   `?ders=<set>` parametresi ile de acilabilir: viewer.html?ders=deneme */
const SETS=[
  {key:'turkce',       title:'Türkçe',            pages:52, img:1},
  {key:'tarih',        title:'Tarih',             pages:169,img:0},
  {key:'cografya',     title:'Coğrafya',          pages:130,img:1},
  {key:'vatandaslik',  title:'Vatandaşlık',       pages:43, img:1},
  {key:'turkce-test',  title:'Türkçe Testleri',   pages:97, img:1},
  {key:'turkce-cikmis',title:'Türkçe Çıkmış Sorular', pages:46, img:1},
  {key:'deneme',       title:'KPSS Tam Deneme',   pages:102,img:1}
];
const STORE={get(k,d){try{const v=localStorage.getItem('dn.'+k);return v===null?d:v;}catch(e){return d;}},
             set(k,v){try{localStorage.setItem('dn.'+k,String(v));}catch(e){}}};
let SET=SETS[1];
let TOTAL=SET.pages;
let cur=1,busy=false,slotId='A',eff='slide',titles={},acc=0,accT=null,pillT=null;
const EN={slide:'Dikey Kayma',zoom:'Zoom Solma',flip:'3D Çevirme',cube:'Küp Geçiş',swirl:'Girdap',random:'Rastgele'};
const PAD=n=>String(n).padStart(3,'0');
const pageSrc=pg=>`assets/${SET.key}/page-${PAD(pg)}.jpg`;
function buildSetChips(){
  const w=document.getElementById('sbSetList');if(!w)return;
  w.innerHTML='';
  SETS.forEach(s=>{
    const b=document.createElement('button');
    b.className='sb-set-b'+(s.key===SET.key?' on':'');
    b.dataset.k=s.key;
    b.textContent=s.title.replace('Türkçe Çıkmış Sorular','Çıkmış').replace('KPSS Tam ','').replace('Türkçe Testleri','Test').replace('Türkçe','Türkçe');
    b.title=`${s.title} · ${s.pages} sayfa`;
    b.addEventListener('click',()=>setSec(s.key));
    w.appendChild(b);
  });
}
function setSec(key){
  const s=SETS.find(x=>x.key===key);
  if(!s||s.key===SET.key)return;
  SET=s;TOTAL=s.pages;titles={};acc=0;
  STORE.set('viewer.ders',key);
  const lbl=document.getElementById('sbSet');if(lbl)lbl.textContent=s.title;
  document.querySelectorAll('.sb-set-b').forEach(b=>b.classList.toggle('on',b.dataset.k===key));
  document.getElementById('pgList').innerHTML='';
  document.getElementById('dots').innerHTML='';
  buildList();buildDots();
  qzYukle();
  const n=Math.min(Math.max(1,parseInt(STORE.get('viewer.sayfa.'+key,'1'),10)||1),TOTAL);
  loadFirst(n);
}
document.addEventListener('DOMContentLoaded',()=>{
  const q=new URLSearchParams(location.search).get('ders');
  const s=SETS.find(x=>x.key===(q||STORE.get('viewer.ders','tarih')))||SETS[1];
  SET=s;TOTAL=s.pages;
  const lbl=document.getElementById('sbSet');if(lbl)lbl.textContent=s.title;
  buildSetChips();
  buildList();buildDots();buildParticles();
  qzInit();
  loadFirst(Math.min(Math.max(1,parseInt(STORE.get('viewer.sayfa.'+SET.key,'1'),10)||1),TOTAL));
  document.addEventListener('click',outsideEP);
});

function buildList(){
  const ul=document.getElementById('pgList'),fr=document.createDocumentFragment();
  for(let i=1;i<=TOTAL;i++){
    const d=document.createElement('div');
    d.className='pi' + (i===1 ? ' active' : '');
    d.dataset.p=i;
    d.innerHTML=`<div class="pi-num">${i}</div><div class="pi-ttl" id="pt${i}">Sayfa ${i}</div>`;
    d.addEventListener('click',()=>selectPage(i));
    fr.appendChild(d);
  }
  ul.appendChild(fr);
  document.getElementById('tbTot').textContent=TOTAL;
  document.getElementById('lbTot').textContent=`/ ${TOTAL}`;
}

function selectPage(pg){
  busy = false;
  if(pg === cur){ scTo(pg); return; }
  const dir = pg > cur ? 1 : -1;
  const prev = cur;
  cur = pg;
  transition(prev, pg, dir);
}

function filterPages(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll('.pi').forEach(el=>{
    const p=el.dataset.p,t=(document.getElementById('pt'+p)?.textContent||'').toLowerCase();
    el.style.display=(!q||p.includes(q)||t.includes(q))?'':'none';
  });
}

const DC=22;
function buildDots(){
  const w=document.getElementById('dots');
  for(let i=0;i<DC;i++){
    const pg=Math.round(1+(i/(DC-1))*(TOTAL-1)),d=document.createElement('div');
    d.className='nd';d.dataset.p=pg;d.title=`Sayfa ${pg}`;
    d.addEventListener('click',()=>selectPage(pg));
    w.appendChild(d);
  }
}
function refreshDots(){
  const all=document.querySelectorAll('.nd');let best=null,bd=Infinity;
  all.forEach(d=>{
    const dist=Math.abs(+d.dataset.p-cur);d.classList.remove('active');
    if(dist<bd){bd=dist;best=d;}
  });
  if(best)best.classList.add('active');
}

function go(dir){
  const n=cur+dir;
  if(n<1||n>TOTAL)return;
  selectPage(n);
}

function jump(pg,dir=null){
  selectPage(pg);
}

function loadFirst(pg){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  const sh=mkShell('slotA'),fr=mkFrame('iframeA',pg);
  sh.appendChild(fr);
  stage.appendChild(sh);
  slotId='A';
  cur=pg;
  refreshUI();
}

function resolveEff(){
  if(eff!=='random')return eff;
  const o=['slide','zoom','flip','cube','swirl'];
  return o[Math.floor(Math.random()*o.length)];
}

function anim(e,dir,enter){
  if(e==='slide')return enter?(dir>0?'e-sd-dn':'e-sd-up'):(dir>0?'l-sd-up':'l-sd-dn');
  if(e==='zoom')return enter?'e-zm':'l-zm';
  if(e==='flip')return enter?'e-fl':'l-fl';
  if(e==='cube')return enter?'e-cb':'l-cb';
  if(e==='swirl')return enter?'e-sw':'l-sw';
  return enter?'e-sd-dn':'l-sd-up';
}

function transition(from,to,dir){
  busy=true;
  doFlash();
  showPill(`Sayfa ${to}`);
  const stage=document.getElementById('stage');
  const e=resolveEff();
  const nextSId='slot'+(slotId==='A'?'B':'A');
  const nextFId='iframe'+(slotId==='A'?'B':'A');
  const stale=document.getElementById(nextSId);
  if(stale)stale.remove();
  const oldSh=document.getElementById('slot'+slotId);
  const newSh=mkShell(nextSId),newFr=mkFrame(nextFId,to);
  newSh.appendChild(newFr);
  stage.appendChild(newSh);
  if(oldSh)oldSh.classList.add(anim(e,dir,false));
  requestAnimationFrame(()=>requestAnimationFrame(()=>newSh.classList.add(anim(e,dir,true))));
  setTimeout(()=>{
    if(oldSh)oldSh.remove();
    newSh.className='frame-shell';
    newSh.id='slot'+(slotId==='A'?'B':'A');
    slotId=slotId==='A'?'B':'A';
    busy=false;
    hidePill();
    refreshUI();
  },DUR+80);
}

function mkShell(id){const d=document.createElement('div');d.className='frame-shell';d.id=id;return d;}
function mkFrame(id,pg){
  if(SET.img){
    /* gorsel setler: Kitap/Galeri ile ayni sayfa gorseli (iframe yerine img) */
    const w=document.createElement('div');
    w.className='pg-card pg-img';
    w.id=id;
    const im=document.createElement('img');
    im.src=pageSrc(pg);
    im.alt=`Sayfa ${pg}`;
    im.decoding='async';
    im.addEventListener('error',()=>{
      w.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#555;font:600 14px system-ui">Sayfa görseli yok: ${pageSrc(pg)}</div>`;
    });
    w.appendChild(im);
    return w;
  }
  const f=document.createElement('iframe');
  f.className='pg-card';
  f.id=id;
  f.src=`page_${pg}.html`;
  f.setAttribute('scrolling','no');
  f.addEventListener('load',()=>onLoad(f,pg));
  return f;
}
function onLoad(fr,pg){
  try{
    const doc=fr.contentDocument||fr.contentWindow?.document;
    if(!doc)return;
    const t=doc.title||'';
    if(t){
      titles[pg]=t;
      const el=document.getElementById('pt'+pg);if(el)el.textContent=t;
      const sct=document.getElementById('sct'+pg);if(sct)sct.textContent=t;
      if(pg===cur)document.getElementById('tbTtl').textContent=t;
    }
    const s=doc.createElement('style');
    s.textContent='html,body{overflow:hidden!important;margin:0!important;padding:0!important;width:100%!important;height:100%!important;display:flex!important;justify-content:center!important;align-items:center!important;background:transparent!important}.page{margin:0 auto!important;box-shadow:none!important}';
    (doc.head||doc.body)?.appendChild(s);
    fr.contentWindow.addEventListener('wheel',e=>{e.preventDefault();handleWheel(e.deltaY);},{passive:false});
    scaleFrame(fr);
  }catch(e){}
}
function scaleFrame(fr){
  try{
    const doc=fr.contentDocument||fr.contentWindow?.document;
    if(!doc)return;
    const p=doc.querySelector('.page');
    if(!p)return;
    const cw=fr.clientWidth||fr.offsetWidth, ch=fr.clientHeight||fr.offsetHeight;
    const pw=p.offsetWidth||820, ph=p.offsetHeight||1160;
    const s=Math.min((cw-20)/pw,(ch-20)/ph,1.0);
    p.style.transformOrigin='center center';
    p.style.transform=`scale(${s})`;
    p.style.transition='transform 0.25s ease';
  }catch(e){}
}
window.addEventListener('resize',()=>{
  const f=document.querySelector('.pg-card');
  if(f)scaleFrame(f);
});
function handleWheel(deltaY){
  if(busy)return;
  acc+=deltaY;
  clearTimeout(accT);
  accT=setTimeout(()=>acc=0,120);
  if(acc>=THR){acc=0;go(1);}
  else if(acc<=-THR){acc=0;go(-1);}
}
function refreshUI(){
  document.getElementById('tbCur').textContent=cur;
  document.getElementById('lbCur').textContent=`Sayfa ${cur}`;
  document.getElementById('tbTtl').textContent=titles[cur]||`Sayfa ${cur}`;
  const pct=((cur-1)/(TOTAL-1))*100;
  document.getElementById('progFill').style.width=Math.max(.5,pct)+'%';
  STORE.set('viewer.sayfa.'+SET.key,cur);
  qzSayfaGuncelle();
  document.querySelectorAll('.pi').forEach(el=>el.classList.toggle('active',+el.dataset.p===cur));
  const a=document.querySelector(`.pi[data-p="${cur}"]`);
  if(a)a.scrollIntoView({behavior:'smooth',block:'nearest'});

  const nextP = cur < TOTAL ? cur + 1 : 1;
  const tag = document.getElementById('downNextTag');
  if(tag){
    tag.textContent = cur < TOTAL ? `Sayfa ${nextP}` : `Başa Dön ↺`;
  }
  const btn = document.getElementById('bottomDownBar');
  if(btn){
    btn.setAttribute('title', cur < TOTAL ? `Sayfa ${nextP}'ye Geç (Aşağı)` : '1. Sayfaya Dön');
  }
  refreshDots();
}
function doFlash(){const f=document.getElementById('flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),160);playTone();}
function playTone(){
  try{
    const ctx=window._actx||(window._actx=new (window.AudioContext||window.webkitAudioContext)());
    if(ctx.state==='suspended')ctx.resume();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(280,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(560,ctx.currentTime+0.09);
    g.gain.setValueAtTime(0.035,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.1);
    o.connect(g);g.connect(ctx.destination);
    o.start();o.stop(ctx.currentTime+0.11);
  }catch(e){}
}
function showPill(msg){clearTimeout(pillT);document.getElementById('pillTxt').textContent=msg;document.getElementById('pill').classList.add('show');}
function hidePill(){pillT=setTimeout(()=>document.getElementById('pill').classList.remove('show'),280);}
function pickEff(name,el){eff=name;document.getElementById('effLbl').textContent=EN[name]||name;document.querySelectorAll('.ep-opt').forEach(o=>o.classList.remove('sel'));if(el)el.classList.add('sel');document.getElementById('ep').classList.remove('open');}
function toggleEP(){document.getElementById('ep').classList.toggle('open');}
function outsideEP(e){const ep=document.getElementById('ep'),badge=document.getElementById('effBadge');if(!ep.contains(e.target)&&!badge.contains(e.target))ep.classList.remove('open');}
window.addEventListener('wheel',e=>{if(qzIcinde(e.target))return;e.preventDefault();handleWheel(e.deltaY);},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  /* test modu kisayollari: isaretleme acikken sayfa degistirmesin */
  if(e.key==='t'||e.key==='T'){if(qzVar()){e.preventDefault();qzToggleDrawer();}return;}
  if(e.key==='a'||e.key==='A'){if(qzVar()){e.preventDefault();qzAnahtarToggle();}return;}
  if(e.key==='Enter'){if(qzVar()&&qzState.acik){e.preventDefault();qzBitir();}return;}
  if(e.key==='Escape'){qzKapat();return;}
  if(qzIcinde(document.activeElement))return;
  const m={ArrowDown:1,ArrowRight:1,PageDown:1,' ':1,ArrowUp:-1,ArrowLeft:-1,PageUp:-1};const d=m[e.key];if(d!==undefined){e.preventDefault();go(d);}if(e.key==='Home'){e.preventDefault();jump(1);}if(e.key==='End'){e.preventDefault();jump(TOTAL);}});
let ty=null;
document.addEventListener('touchstart',e=>{if(qzIcinde(e.target)){ty=null;return;}ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(ty===null)return;const dy=ty-e.changedTouches[0].clientY;if(Math.abs(dy)>55)go(dy>0?1:-1);ty=null;},{passive:true});
function scTo(pg){const el=document.querySelector(`.pi[data-p="${pg}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
function buildParticles(){const w=document.getElementById('particles'),C=['#7c6dfa','#fa6d9a','#43d4ac','#f7c948','#6deaff','#fa9c4b'];for(let i=0;i<32;i++){const p=document.createElement('div');p.className='p';const sz=Math.random()*4+1.5;p.style.cssText=`width:${sz}px;height:${sz}px;background:${C[Math.floor(Math.random()*C.length)]};left:${Math.random()*100}%;animation-duration:${Math.random()*18+11}s;animation-delay:${Math.random()*14}s;filter:blur(${Math.random()>.65?1:0}px)`;w.appendChild(p);}}
/* ── TEST MODU (A–E) ────────────────────────────────────────────────
   Kartlar quizData/quizText bloklarindan uretilir; A–E secenekleri sabit
   uretilir (her soru 5 secenekli). Isaretler `oku.quiz.<set>` anahtarinda
   saklanir -> Kitap Modu (oku.html) ve Galeri (galeri.html) ile AYNI
   ilerleme paylasilir. Cevap anahtari kendiliginden gorunmez; yalnizca
   "Anahtari goster" ya da "Denemeyi bitir" sonrasi acilir. */
const QZ_SIK=['A','B','C','D','E'];
const qzState={sec:{},bitir:false,anahtar:false,acik:false,kapali:false};
let QZ_DATA=null,QZ_TEXT=null;
function qzJson(id){try{const t=document.getElementById(id);return t?JSON.parse(t.textContent||'{}')||{}:{};}catch(e){return {};}}
function qzVeri(){if(!QZ_DATA)QZ_DATA=qzJson('quizData');return QZ_DATA;}
function qzTxt(){if(!QZ_TEXT)QZ_TEXT=qzJson('quizText');return QZ_TEXT;}
function qzSet(){return qzVeri()[SET.key]||null;}
function qzVar(){const d=qzSet();return !!(d&&d.pages&&Object.keys(d.pages).length);}
function qzIcinde(el){if(!el||!el.closest)return false;
  return !!(el.closest('.qz-drawer')||el.closest('.qz-modal')||el.closest('#qzToggle'));}
function qzSorular(pages){
  const d=qzSet();if(!d)return [];
  const out=[];
  pages.forEach(p=>{(d.pages[String(p)]||[]).forEach(n=>out.push({id:p+':'+n,p:p,n:n}));});
  return out.sort((a,b)=>a.n-b.n);
}
function qzTumu(){
  const d=qzSet();if(!d)return [];
  const out=[];
  Object.keys(d.pages||{}).forEach(p=>(d.pages[p]||[]).forEach(n=>out.push({id:p+':'+n,p:parseInt(p,10),n:n})));
  return out.sort((a,b)=>(a.p-b.p)||(a.n-b.n));
}
function qzSec(s){return qzState.sec[s.id]||null;}
function qzKey(s){
  const d=qzSet();if(!d||!d.keys)return null;
  const m=d.keys[String(s.p)];return m?(m[String(s.n)]||null):null;
}
function qzKok(s){
  const t=(qzTxt()[SET.key]||{})[String(s.p)];
  return t?String(t[String(s.n)]||''):'';
}
function qzKaydet(){try{localStorage.setItem('oku.quiz.'+SET.key,JSON.stringify(qzState.sec));}catch(e){}}
function qzYukle(){
  qzState.sec={};qzState.bitir=false;qzState.anahtar=false;
  try{const v=JSON.parse(localStorage.getItem('oku.quiz.'+SET.key)||'{}');
      if(v&&typeof v==='object')qzState.sec=v;}catch(e){}
  try{qzState.kapali=sessionStorage.getItem('dn.qz.kapali')==='1';}catch(e){}
}
function qzSay(){
  const t=qzTumu();let ok=0,kotu=0,bos=0,anahtarli=0,isaretli=0;
  t.forEach(s=>{
    const v=qzSec(s),a=qzKey(s);
    if(v)isaretli++;
    if(!a)return;
    anahtarli++;
    if(!v)bos++;else if(v===a)ok++;else kotu++;
  });
  return {ok:ok,kotu:kotu,bos:bos,anahtarli:anahtarli,isaretli:isaretli,toplam:t.length};
}
function qzGorunur(){return qzState.anahtar||qzState.bitir;}
const qzKacis=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function qzKartHTML(s){
  const v=qzSec(s),a=qzKey(s),kok=qzKok(s),acik=qzGorunur();
  const dug=QZ_SIK.map(h=>{
    let cls='',ic=h;
    if(acik&&a){
      if(h===a){cls='ok';ic=h+' &#10003;';}
      else if(v&&h===v){cls='bad';ic=h+' &#10007;';}
      else cls='dim';
    } else if(v&&h===v)cls='sel';
    return '<button type="button" data-h="'+h+'" class="'+cls+'" aria-pressed="'+(v===h?'true':'false')+'">'+ic+'</button>';
  }).join('');
  const tik=(acik&&a)
    ? (v ? (v===a?'<span class="tick">&#10003;</span>':'<span class="tick bad">&#10007;</span>')
         : '<span class="tick bos">&#8212;</span>')
    : '<span class="tick">&#10003;</span>';
  return '<div class="qh"><span class="qn">Soru '+s.n+'</span><span class="sp">sayfa '+s.p+'</span>'+tik+'</div>'
    +'<div class="qk'+(kok?'':' bos')+'">'+(kok?qzKacis(kok)
      :'Soru kökü PDF metin katmanından çıkarılamadı; soruyu sayfa görselinden okuyup işaretleyin.')+'</div>'
    +'<div class="qo" role="group" aria-label="Soru '+s.n+' seçenekleri">'+dug+'</div>';
}
function qzIsaretle(s,h){
  if(qzState.bitir||qzState.anahtar)return;
  if(qzState.sec[s.id]===h)delete qzState.sec[s.id];
  else qzState.sec[s.id]=h;
  qzKaydet();
  const c=document.querySelector('.qcard[data-qid="'+s.id+'"]');
  if(c){c.classList.toggle('done',!!qzState.sec[s.id]);c.innerHTML=qzKartHTML(s);}
  qzTabloGuncelle();
}
function qzTabloGuncelle(){
  const s=qzSay();
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set('qzMarked',s.isaretli);set('qzTotal',s.toplam);
  const kb=document.getElementById('qzKeyBtn');
  if(kb)kb.textContent=qzState.anahtar?'Anahtarı gizle':'Anahtarı göster';
  qzAnahtarStrip();
}
/* "Anahtari goster": o SAYFANIN cevap anahtari serit halinde acilir,
   kartlarda dogru sik yesil (✓) / isaretlenen yanlis sik kirmizi (✗) olur. */
function qzAnahtarStrip(){
  const s=document.getElementById('qzKeyStrip');if(!s)return;
  if(!qzState.anahtar){s.classList.remove('on');s.innerHTML='';return;}
  const d=qzSet();
  const m=(d&&d.keys)?d.keys[String(cur)]:null;
  const nos=(d&&d.pages)?(d.pages[String(cur)]||[]):[];
  if(!nos.length||!m){s.classList.remove('on');s.innerHTML='';return;}
  s.classList.add('on');
  s.innerHTML='<span class="kk">Sayfa '+cur+' cevap anahtarı:</span> '
    +nos.map(n=>'S.'+n+' <b>'+(m[String(n)]||'—')+'</b>').join(' · ');
}
function qzSayfaGuncelle(){
  const t=document.getElementById('qzToggle');
  if(!qzVar()){
    if(t)t.hidden=true;
    qzDrawer(false);
    return;
  }
  const sorular=qzSorular([cur]);
  if(t)t.hidden=!sorular.length;
  const b=document.getElementById('qzBadge');if(b)b.textContent=sorular.length;
  const kutu=document.getElementById('qzCards');
  if(!sorular.length){
    if(kutu)kutu.innerHTML='<div class="qz-none">Bu sayfada test sorusu yok. Soru bulunan sayfalara gidince A–E işaretleme açılır.</div>';
    qzTabloGuncelle();
    if(qzState.acik)qzDrawer(false);
    return;
  }
  if(kutu){
    kutu.innerHTML='';
    const fr=document.createDocumentFragment();
    sorular.forEach(s=>{
      const c=document.createElement('div');
      c.className='qcard'+(qzSec(s)?' done':'');
      c.dataset.qid=s.id;
      c.innerHTML=qzKartHTML(s);
      c.addEventListener('click',ev=>{
        const btn=ev.target.closest('button[data-h]');
        if(btn)qzIsaretle(s,btn.dataset.h);
      });
      fr.appendChild(c);
    });
    kutu.appendChild(fr);
  }
  qzTabloGuncelle();
  /* soru bulunan sayfaya gelince cekmece kendiliginden acilir; elle
     kapatilmissa kullanici acmadikca geri acilmaz */
  if(!qzState.kapali&&!qzState.acik)qzDrawer(true);
}
/* elle=true yalnizca kullanici kapattiginda: sayfada soru yok diye otomatik
   kapanma "kullanici kapatti" sayilmaz, sonraki soru sayfasinda yeniden acilir. */
function qzDrawer(acik,elle){
  const yeni=!!acik;
  if(!yeni&&elle){
    qzState.kapali=true;
    try{sessionStorage.setItem('dn.qz.kapali','1');}catch(e){}
  }
  qzState.acik=yeni;
  document.body.classList.toggle('qz-open',yeni);
}
function qzToggleDrawer(){
  if(qzState.acik){qzDrawer(false,true);return;}
  qzState.kapali=false;
  try{sessionStorage.setItem('dn.qz.kapali','0');}catch(e){}
  qzDrawer(true);
}
function qzAnahtarToggle(){
  qzState.anahtar=!qzState.anahtar;
  if(!qzState.anahtar)qzState.bitir=false;
  qzSayfaGuncelle();
}
function qzPill(msg){showPill(msg);hidePill();}
/* sik bazli basari: dogru / (dogru + yanlis); bos birakilanlar orana girmez.
   Esikler: >=%70 kolay, >=%40 orta, alti zor. */
function qzZorluk(c){
  const t=c[0]+c[1];
  if(!t)return '—';
  const y=Math.round(c[0]/t*100);
  return y+(y>=70?' kolay':(y>=40?' orta':' zor'));
}
function qzAnalizHTML(s){
  const sayac={};QZ_SIK.forEach(h=>sayac[h]=[0,0,0]);
  let anahtarsiz=0;
  qzTumu().forEach(q=>{
    const a=qzKey(q);
    if(!a){anahtarsiz++;return;}
    const v=qzSec(q);
    sayac[a][!v?2:(v===a?0:1)]++;
  });
  let h='<div class="ad"><div class="hd">A–E analizi · '+s.anahtarli+' soru anahtarlı'
    +(anahtarsiz?' · '+anahtarsiz+' anahtarsız':'')+'</div>'
    +'<div class="gv"><span>Şık</span><span>Doğru</span><span>Yanlış</span><span>Boş</span><span>Başarı</span></div>';
  QZ_SIK.forEach(k=>{
    const c=sayac[k],t=c[0]+c[1]+c[2];
    h+='<div class="gr'+(t?'':' off')+'"><span class="gk">'+k+'</span>'
      +'<span class="gc okc">'+c[0]+'</span><span class="gc badc">'+c[1]+'</span>'
      +'<span class="gc">'+c[2]+'</span><span class="gz">'+(t?qzZorluk(c):'—')+'</span></div>';
  });
  h+='<div class="gr sum"><span class="gk">Σ</span><span class="gc okc">'+s.ok+'</span>'
    +'<span class="gc badc">'+s.kotu+'</span><span class="gc">'+s.bos+'</span>'
    +'<span class="gz">'+qzZorluk([s.ok,s.kotu,s.bos])+'</span></div></div>';
  return h;
}
function qzGit(q){
  qzModalKapat();
  if(q.p!==cur)selectPage(q.p);
  setTimeout(()=>{
    const c=document.querySelector('.qcard[data-qid="'+q.id+'"]');
    if(c)c.scrollIntoView({behavior:'smooth',block:'center'});
  },280);
}
function qzModalKapat(){document.getElementById('qzModal').classList.remove('open');}
function qzSonuc(){
  const s=qzSay();
  document.getElementById('qzTitle').textContent=SET.title+' — sonuç';
  document.getElementById('qzSub').textContent=s.anahtarli
    ? s.ok+' doğru · '+s.kotu+' yanlış · '+s.bos+' boş'
      +(s.anahtarli<s.toplam?' · '+(s.toplam-s.anahtarli)+' sorunun anahtarı henüz eklenmedi':'')
    : s.isaretli+' / '+s.toplam+' soru işaretlendi · anahtar eklenince puanlama otomatik açılır';
  const rows=document.getElementById('qzRows');
  rows.innerHTML=s.anahtarli?qzAnalizHTML(s):'';
  const fr=document.createDocumentFragment();
  qzTumu().forEach(q=>{
    const a=qzKey(q),v=qzSec(q);
    const r=document.createElement('div');
    r.className='row';r.title='Soruyu aç';
    r.innerHTML='<span class="n">S.'+q.n+'</span>'
      +'<span class="a">'+(v||'—')+(a?' / '+a:'')+'</span>'
      +'<span>'+(a?(v?(v===a?'<b class="okc">&#10003; Doğru</b>':'<b class="badc">&#10007; Yanlış</b>')
                 :'<b class="mute">Boş</b>')
               :'<b class="mute">'+(v?'işaretli · anahtar yok':'boş · anahtar yok')+'</b>')+'</span>'
      +'<span class="go">s.'+q.p+' &#8599;</span>';
    r.addEventListener('click',()=>qzGit(q));
    fr.appendChild(r);
  });
  rows.appendChild(fr);
  document.getElementById('qzModal').classList.add('open');
}
function qzBitir(){
  if(!qzTumu().length)return;
  if(!Object.keys(qzState.sec).length){qzPill('Önce en az bir soruyu işaretleyin');return;}
  qzState.bitir=true;
  qzState.anahtar=qzSay().anahtarli>0;
  qzSayfaGuncelle();
  qzSonuc();
}
function qzSifirla(){
  qzState.sec={};qzState.bitir=false;qzState.anahtar=false;
  qzKaydet();qzModalKapat();qzSayfaGuncelle();
  qzPill('İşaretler temizlendi');
}
function qzKapat(){qzModalKapat();if(qzState.acik)qzDrawer(false);}
function qzInit(){
  qzYukle();
  const on=(id,ev,fn)=>{const e=document.getElementById(id);if(e)e.addEventListener(ev,fn);};
  on('qzToggle','click',qzToggleDrawer);
  on('qzClose','click',()=>qzDrawer(false,true));
  on('qzKeyBtn','click',qzAnahtarToggle);
  on('qzFinish','click',qzBitir);
  on('qzReset','click',qzSifirla);
  on('qzModalClose','click',qzModalKapat);
  on('qzModalReset','click',qzSifirla);
  const m=document.getElementById('qzModal');
  if(m)m.addEventListener('click',ev=>{if(ev.target===m)qzModalKapat();});
}
</script>
