<!DOCTYPE html>
<html lang="tr" data-theme="dark" data-paper="beyaz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a16">
<meta name="description" content="KPSS ders notları Kitap Modu: sürekli kaydırma, temizlenmiş sayfalar, ayraçlar, kaldığın yerden devam. Türkçe, Tarih, Coğrafya, Vatandaşlık — 394 sayfa.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c5cff'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<title>Kitap Modu · Ders Notları</title>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#070a16; --panel:rgba(255,255,255,.055); --panel-2:rgba(255,255,255,.09);
  --stroke:rgba(255,255,255,.12); --text:#e9efff; --muted:#8f9dc0;
  --shadow:0 30px 80px rgba(0,0,0,.55); --accent:#7c5cff; --accent-2:#2ec4b6;
  --ease:cubic-bezier(.22,.75,.25,1); --colw:860px;
}
html[data-theme="light"]{
  --bg:#e9edf7; --panel:rgba(255,255,255,.68); --panel-2:rgba(255,255,255,.92);
  --stroke:rgba(16,28,64,.10); --text:#111a30; --muted:#5d6a8c;
  --shadow:0 26px 60px rgba(28,44,92,.20);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,"Noto Sans",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .5s var(--ease),color .35s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--accent);color:#fff}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora b{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen;animation:float 26s ease-in-out infinite}
html[data-theme="light"] .aurora b{opacity:.34;mix-blend-mode:normal;filter:blur(80px)}
.aurora b:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-12vw;background:var(--accent)}
.aurora b:nth-child(2){width:40vw;height:40vw;right:-6vw;top:6vh;background:var(--accent-2);animation-duration:31s;animation-delay:-6s}
.aurora b:nth-child(3){width:38vw;height:38vw;left:26vw;bottom:-16vw;background:#ff5f6d;animation-duration:37s;animation-delay:-12s}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(6vw,4vh,0) scale(1.12)}66%{transform:translate3d(-5vw,6vh,0) scale(.92)}}
.app{position:relative;z-index:2;display:flex;flex-direction:column;min-height:100dvh}
header.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px clamp(10px,1.6vw,20px);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));border-bottom:1px solid var(--stroke)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand .mark{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));font-size:19px;color:#fff}
.brand .txt strong{display:block;font-size:15px;letter-spacing:.2px}
.brand .txt span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
.seg{display:flex;align-items:center;gap:4px;padding:4px;border-radius:14px;border:1px solid var(--stroke);background:var(--panel)}
.seg .cap{font-size:10.5px;color:var(--muted);padding:0 4px 0 8px;letter-spacing:.08em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:12px;
  border:1px solid var(--stroke);background:var(--panel);font-size:13px;font-weight:600;transition:all .2s var(--ease);white-space:nowrap;text-decoration:none;color:inherit}
.chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.chip.on{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
a.chip:visited{color:inherit}
.seg .chip{height:30px;padding:0 10px;font-size:12px;border-color:transparent;background:transparent}
.seg .chip.on{background:var(--accent)}
.spacer{flex:1}
input[type="range"]{accent-color:var(--accent);width:110px}
.progress{position:sticky;top:0;z-index:51;height:4px;background:transparent}
.progress i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .25s var(--ease)}
/* ---------- kitap govdesi ---------- */
.wrap{flex:1;width:100%;display:flex;gap:18px;padding:18px clamp(10px,2vw,26px) 60px;align-items:flex-start;justify-content:center}
aside.lib{position:sticky;top:76px;width:288px;flex:0 0 288px;display:flex;flex-direction:column;gap:12px;max-height:calc(100dvh - 100px)}
.card{border-radius:18px;border:1px solid var(--stroke);background:var(--panel);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);padding:14px}
.card h3{margin:2px 2px 10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.sub{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:13px;border:1px solid transparent;transition:all .2s var(--ease)}
.sub:hover{background:var(--panel-2)}
.sub.on{background:var(--panel-2);border-color:var(--c,var(--accent))}
.sub .ic{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center;font-size:17px;color:#fff;
  background:linear-gradient(140deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)) 45%,#ffffff40))}
.sub .meta{min-width:0;flex:1}
.sub .meta strong{display:block;font-size:13.5px}
.sub .meta span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .bar{height:4px;border-radius:99px;background:var(--panel-2);margin-top:6px;overflow:hidden}
.sub .bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.sub .pc{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.bm{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:11px;font-size:13px;transition:background .2s}
.bm:hover{background:var(--panel-2)}
.bm .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.bm .x{margin-left:auto;color:var(--muted);font-size:15px;padding:0 4px}
.bm .x:hover{color:#ff5f6d}
.empty{font-size:12.5px;color:var(--muted);padding:4px 6px;line-height:1.7}
.hint{font-size:11px;color:var(--muted);line-height:2}
kbd{display:inline-block;min-width:20px;text-align:center;padding:1px 6px;border-radius:6px;border:1px solid var(--stroke);background:var(--panel-2);font-size:10.5px;font-family:inherit}
.col{flex:1;min-width:0;max-width:var(--colw);width:100%}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 2px 14px}
.crumb .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.crumb strong{font-size:17px}
.crumb .muted{color:var(--muted);font-size:13px}
.resume{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:12px 16px;border-radius:16px;
  border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:var(--panel);
  backdrop-filter:blur(18px);box-shadow:var(--shadow);font-size:13.5px}
.resume b{color:var(--accent)}
.page{background:#fff;border-radius:12px;overflow:hidden;margin:0 0 20px;
  box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.25);scroll-margin-top:140px}
html[data-theme="dark"] .page{box-shadow:0 26px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.10)}
.page img{display:block;width:100%;height:auto;background:#fff;opacity:0;transition:opacity .4s var(--ease)}
.page img.ready{opacity:1}
html[data-paper="sepya"] .page img{filter:sepia(.34) contrast(1.02) brightness(1.01)}
html[data-paper="gece"] .page{background:#101319}
html[data-paper="gece"] .page img{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.94)}
.pcap{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);
  border-top:1px solid var(--stroke);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
html[data-theme="light"] .pcap{background:#fff}
.pcap .mk{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:10px;
  border:1px solid var(--stroke);font-size:12px;font-weight:700;transition:all .2s}
.pcap .mk:hover{border-color:var(--accent)}
.pcap .mk.on{background:var(--accent);border-color:transparent;color:#fff}
.tail{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.tail .chip{gap:8px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:60;
  padding:11px 18px;border-radius:14px;border:1px solid var(--stroke);background:var(--panel-2);
  backdrop-filter:blur(18px);box-shadow:var(--shadow);font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.burger{display:none}
body.focus header.bar .hide-focus,body.focus aside.lib,body.focus .tail{display:none}
body.focus header.bar{opacity:.25}
body.focus header.bar:hover{opacity:1}
@media (max-width:1080px){.brand .txt span{display:none}.cap,.zoomval{display:none}}
@media (max-width:920px){
  aside.lib{position:fixed;left:10px;top:70px;bottom:12px;z-index:40;width:min(80vw,300px);
    overflow-y:auto;border-radius:18px;transition:transform .3s var(--ease),opacity .25s}
  body.no-lib aside.lib{transform:translateX(-118%);opacity:0;pointer-events:none}
  .burger{display:inline-flex}
  /* baslik tek satir ve yatay kaydirilabilir: panel ile cakismaz, okuma alani buyur */
  header.bar{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;
    padding:8px 10px;gap:6px}
  header.bar::-webkit-scrollbar{display:none}
  .spacer{display:none}
  header.bar .chip,header.bar .seg,header.bar .brand,header.bar label{flex:0 0 auto}
}

/* ---------- v2 okunabilirlik: telefon + masaüstü ---------- */
.hint{font-size:12px;line-height:1.95}
.crumb .muted{font-size:13.5px}
.sub .meta strong{font-size:14px}
.sub .meta span{font-size:11.5px}
.pcap{font-size:13px}
.pcap .mk{height:34px;font-size:12.5px}
body.no-scroll{overflow:hidden}
/* sınav yapısı kartı (sayfa listesinin başında) */
.intro-card{margin:0 0 20px;padding:16px 18px;border-radius:18px;
  border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));box-shadow:var(--shadow)}
.intro-card h4{margin:0 0 8px;font-size:17px}
.intro-card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.9}
.intro-card p b{color:var(--text)}
.intro-card ul{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:14px;line-height:1.85}
.intro-card .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.intro-card .trick{border-left:3px solid var(--accent-2);background:var(--panel);border-radius:0 10px 10px 0;
  padding:9px 12px;margin:10px 0 0;font-size:14px;line-height:1.8}
/* konu özeti çekmecesi */
.drawer-mask{position:fixed;inset:0;z-index:65;background:rgba(4,7,16,.6);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:66;top:0;right:0;bottom:0;width:min(640px,100%);display:flex;flex-direction:column;
  border-left:1px solid var(--stroke);background:var(--panel-2);
  backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:var(--shadow);transform:translateX(104%);transition:transform .38s var(--ease)}
.drawer.show{transform:none}
.drawer-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--stroke)}
.drawer-head .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;
  background:var(--accent);color:#fff;font-size:16px}
.drawer-head b{display:block;font-size:15.5px;line-height:1.35}
.dsub{font-size:11.5px;color:var(--muted)}
.drawer-body{overflow-y:auto;padding:14px 15px 48px}
.oz{margin:0 0 12px;border:1px solid var(--stroke);border-radius:16px;background:var(--panel);overflow:hidden}
.oz>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:13px 15px;
  min-height:52px;font-weight:800;font-size:15px;touch-action:manipulation}
.oz>summary::-webkit-details-marker{display:none}
.oz>summary .n{flex:0 0 30px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:var(--accent);color:#fff;font-size:14px}
.oz>summary .chev{margin-left:auto;color:var(--muted)}
.oz[open]>summary{border-bottom:1px solid var(--stroke)}
.oz .in{padding:12px 15px 16px}
.oz h5{margin:14px 0 8px;font-size:14.5px}
.oz h5:first-child{margin-top:2px}
.oz p{margin:0 0 10px;color:var(--muted);font-size:14.5px;line-height:1.9}
.oz p b,.oz ul b{color:var(--text)}
.oz ul{margin:0;padding-left:20px;color:var(--muted);font-size:14.5px;line-height:1.9}
.oz li{margin:8px 0}
.oz .trick{border-left:3px solid var(--accent-2);background:var(--panel-2);border-radius:0 10px 10px 0;
  padding:9px 12px;margin:10px 0 0;font-size:14px;line-height:1.8}
.oz .trick b{color:var(--accent-2)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
@media (max-width:760px){
  header.bar{padding:8px 9px;gap:6px}
  .brand .mark{width:34px;height:34px;flex-basis:34px;font-size:16px}
  .brand .txt strong{font-size:14px}
  .chip{height:44px;padding:0 12px;font-size:13px}
  .seg .chip{height:34px;padding:0 10px}
  .wrap{padding:10px 9px 72px;gap:10px}
  aside.lib{top:66px}
  .page{margin:0 0 14px;border-radius:10px}
  .intro-card{padding:14px}
  .drawer{width:100%}
  .drawer-body{padding:12px 11px 40px}
  .seg{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .seg::-webkit-scrollbar{display:none}
  .seg .cap{display:none}
}
@media (max-width:620px){.hide-sm,.hide-xs{display:none}}
@media (min-width:1200px){
  aside.lib{width:320px;flex:0 0 320px}
  .drawer{width:min(700px,100%)}
  .crumb strong{font-size:18px}
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><b></b><b></b><b></b></div>
<div class="app">
  <div class="progress"><i id="progressBar"></i></div>
  <header class="bar">
    <button class="chip burger" id="btnLib" title="Panel (K)">&#9776;</button>
    <a class="brand" href="index.html" title="Ana sayfaya dön">
      <div class="mark">&#128214;</div>
      <div class="txt"><strong>Kitap Modu</strong><span>Ders Notları</span></div>
    </a>
    <div class="spacer"></div>
    <div class="seg hide-focus" id="subjectSeg" role="tablist" aria-label="Dersler"></div>
    <div class="seg hide-focus" id="paperSeg" aria-label="Sayfa görünümü">
      <span class="cap">Sayfa</span>
      <button class="chip on" data-paper="beyaz" title="Temiz beyaz sayfa">Beyaz</button>
      <button class="chip" data-paper="sepya" title="Göz yormayan sıcak ton">Sepya</button>
      <button class="chip" data-paper="gece" title="Gece okuma (ters renk)">Gece</button>
    </div>
    <label class="chip hide-focus hide-xs" title="Sayfa genişliği">Genişlik <input type="range" id="widthRange" min="560" max="1100" step="20" value="860" aria-label="Sayfa genişliği"></label>
    <a class="chip hide-xs" href="index.html" title="Ana sayfa">&#8962;<span class="hide-sm"> Ana Sayfa</span></a>
    <a class="chip" href="galeri.html" title="Galeri görünümü">&#9639;&#9640;<span class="hide-sm"> Galeri</span></a>
    <button class="chip hide-focus" id="btnClean" title="Temizlenmiş / orijinal sayfa (C)">&#10022; Temiz: açık</button>
    <button class="chip hide-focus" id="btnFocus" title="Odak modu (O)">&#9678; Odak</button>
    <button class="chip" id="btnOzet" title="Türkçe konu özeti (Ö)" hidden>&#128221;<span class="hide-sm"> Özet</span></button>
    <button class="chip" id="btnTheme" title="Tema (D)">&#9789;</button>
  </header>
  <div class="wrap">
    <aside class="lib" id="lib">
      <div class="card">
        <h3>İçindekiler</h3>
        <nav id="subjectList"></nav>
      </div>
      <div class="card">
        <h3>Ayraçlarım</h3>
        <div id="bmList"></div>
      </div>
      <div class="card">
        <h3>Kısayollar</h3>
        <div class="hint">
          <kbd>&uarr;</kbd><kbd>&darr;</kbd> kaydır &middot; <kbd>B</kbd> ayraç<br>
          <kbd>Ö</kbd> konu özeti &middot; <kbd>C</kbd> temiz sayfa<br>
          <kbd>O</kbd> odak &middot; <kbd>D</kbd> tema &middot; <kbd>K</kbd> panel<br>
          <kbd>1</kbd>…<kbd>4</kbd> ders &middot; <kbd>Esc</kbd> kapat
        </div>
      </div>
    </aside>
    <main class="col">
      <div class="crumb"><span class="dot" id="subjDot"></span><strong id="subjTitle">—</strong><span class="muted" id="subjSub"></span></div>
      <button class="resume" id="resumeBtn" hidden></button>
      <div id="pages"></div>
      <div class="tail">
        <button class="chip" id="prevSub">&#8592; Önceki ders</button>
        <span id="tailInfo" style="font-size:12.5px;color:var(--muted)"></span>
        <button class="chip" id="nextSub">Sonraki ders &#8594;</button>
      </div>
    </main>
  </div>
</div>
<div class="drawer-mask" id="ozMask" hidden></div>
<aside class="drawer" id="ozDrawer" hidden role="dialog" aria-label="Türkçe konu özeti">
  <div class="drawer-head">
    <span class="ic">&#128221;</span>
    <span><b id="ozTitle">Türkçe Konu Özeti</b><span class="dsub" id="ozSub"></span></span>
    <span class="spacer"></span>
    <button class="chip" id="ozClose" title="Kapat (Esc)">&#10005;<span class="hide-sm"> Kapat</span></button>
  </div>
  <div class="drawer-body" id="ozBody"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* Veri dogrudan gomulu: file:// uzerinden fetch/CORS calismaz. */
const LIBRARY = [
  { key: 'turkce',      title: 'Türkçe',      subtitle: 'Dil Bilgisi ve Anlatım',      icon: '&#9998;',  pages: 52,  color: '#7c5cff' },
  { key: 'tarih',       title: 'Tarih',       subtitle: "Osmanlı'dan Cumhuriyet'e",    icon: '&#127963;', pages: 169, color: '#f4a261' },
  { key: 'cografya',    title: 'Coğrafya',    subtitle: 'Türkiye ve Dünya Coğrafyası', icon: '&#127758;', pages: 130, color: '#2ec4b6' },
  { key: 'vatandaslik', title: 'Vatandaşlık', subtitle: 'Vatandaşlık ve İnsan Hakları', icon: '&#9878;', pages: 43,  color: '#ff5f6d' }
];
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const PAD = n => String(n).padStart(3, '0');
const STORE = {
  get(k, d) { try { const v = localStorage.getItem('oku.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('oku.' + k, v); } catch (e) {} },
};
const el = {
  pages: $('#pages'), subjectList: $('#subjectList'), subjectSeg: $('#subjectSeg'),
  progress: $('#progressBar'), toast: $('#toast'), bmList: $('#bmList'),
  subjTitle: $('#subjTitle'), subjSub: $('#subjSub'), subjDot: $('#subjDot'),
  resumeBtn: $('#resumeBtn'), tailInfo: $('#tailInfo'),
  ozDrawer: $('#ozDrawer'), ozMask: $('#ozMask'), ozBody: $('#ozBody'),
  ozTitle: $('#ozTitle'), ozSub: $('#ozSub'),
};
const state = {
  key: (() => { try {
    const q = new URLSearchParams(location.search).get('ders');
    if (q && LIBRARY.some(s => s.key === q)) return q;
  } catch (e) {}
  return LIBRARY.some(s => s.key === STORE.get('ders', '')) ? STORE.get('ders') : LIBRARY[0].key; })(),
  clean: STORE.get('temiz', '1') !== '0',
  max: 0, current: 1,
};
const subject = () => LIBRARY.find(s => s.key === state.key) || LIBRARY[0];
const src = (key, n) => 'assets/' + key + '/' + (state.clean ? 'clean/' : '') + 'page-' + PAD(n) + '.jpg';

/* ---------- Konu özetleri (veri: tools/ozet.py -> #ozetData) ---------- */
const OZET_ALL = (() => {
  try { return JSON.parse($('#ozetData').textContent || '{}') || {}; } catch (e) { return {}; }
})();
const ozetOf = key => OZET_ALL[key] || null;
function ozNotes(list) {
  return (list || []).map(n => '<div class="trick"><b>' + n.tur + ':</b> ' + n.d + '</div>').join('');
}
function ozBlockHTML(b) {
  let h = '';
  if (b.ad) h += '<h5>' + b.ad + '</h5>';
  if (b.giris) h += '<p>' + b.giris + '</p>';
  if (b.maddeler && b.maddeler.length) {
    h += '<ul>' + b.maddeler.map(m => '<li><b>' + m.t + ':</b> ' + m.d + ozNotes(m.n) + '</li>').join('') + '</ul>';
  }
  h += ozNotes(b.notlar);
  return h;
}
function ozHTML(key) {
  const d = ozetOf(key);
  if (!d) return '';
  let h = '<div class="oz"><div class="in"><p>' + d.giris + '</p>';
  if (d.vurgu && d.vurgu.length) {
    h += '<div class="chiprow">' + d.vurgu.map(v => '<span class="chip">' + v + '</span>').join('') + '</div>';
  }
  h += '</div></div>';
  h += '<div class="chiprow"><button class="chip" id="ozAll">Tümünü kapat</button>' +
    '<a class="chip" href="turkce-ozet.html">Tam sayfa özet &#8599;</a></div>';
  d.bolumler.forEach(b => {
    h += '<details class="oz" open><summary><span class="n">' + b.no + '</span><span>' + b.ad + '</span>' +
      (b.etiket ? '<span class="dsub">&nbsp;' + b.etiket + '</span>' : '') +
      '<span class="chev">&#9662;</span></summary><div class="in">';
    (b.bloklar || []).forEach(bl => { h += ozBlockHTML(bl); });
    h += '</div></details>';
  });
  return h;
}
function ozToggle(force) {
  const wrap = el.ozDrawer, mask = el.ozMask;
  const want = force === undefined ? !!wrap.hidden : !!force;
  if (want) {
    const d = ozetOf(state.key);
    if (!d) { toast('Bu ders için konu özeti henüz eklenmedi'); return; }
    el.ozTitle.textContent = d.baslik;
    el.ozSub.textContent = subject().title + ' · ' + d.bolumler.length + ' bölüm';
    el.ozBody.innerHTML = ozHTML(state.key);
    el.ozBody.scrollTop = 0;
    const tog = $('#ozAll', el.ozBody);
    if (tog) {
      const all = $$('.oz', el.ozBody).filter(x => x.tagName === 'DETAILS');
      tog.addEventListener('click', () => {
        const open = all.some(x => !x.open);
        all.forEach(x => { x.open = open; });
        tog.textContent = open ? 'Tümünü kapat' : 'Tümünü aç';
      });
    }
    wrap.hidden = false; mask.hidden = false;
    requestAnimationFrame(() => { wrap.classList.add('show'); mask.classList.add('show'); });
    document.body.classList.add('no-scroll');
  } else {
    wrap.classList.remove('show'); mask.classList.remove('show');
    document.body.classList.remove('no-scroll');
    clearTimeout(ozToggle._t);
    ozToggle._t = setTimeout(() => { wrap.hidden = true; mask.hidden = true; }, 380);
  }
}
function toast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.toast.classList.remove('show'), 1600);
}
const getBm = key => { try { return JSON.parse(localStorage.getItem('oku.ayrac.' + key) || '[]'); } catch (e) { return []; } };
const setBm = (key, arr) => { try { localStorage.setItem('oku.ayrac.' + key, JSON.stringify(arr)); } catch (e) {} };
function isMarked(n) { return getBm(state.key).includes(n); }
function toggleMark(n) {
  let arr = getBm(state.key);
  arr = arr.includes(n) ? arr.filter(x => x !== n) : [...arr, n].sort((a, b) => a - b);
  setBm(state.key, arr);
  $$('.page[data-n="' + n + '"] .mk', el.pages).forEach(b => b.classList.toggle('on', arr.includes(n)));
  renderBm();
  toast(arr.includes(n) ? 'Ayraç eklendi: sayfa ' + n : 'Ayraç kaldırıldı: sayfa ' + n);
}
function renderBm() {
  const arr = getBm(state.key);
  el.bmList.innerHTML = arr.length ? '' : '<div class="empty">Henüz ayraç yok.<br>Sayfa altındaki <b>Ayraç</b> düğmesini ya da <kbd>B</kbd> tuşunu kullanın.</div>';
  arr.forEach(n => {
    const b = document.createElement('div');
    b.className = 'bm';
    b.innerHTML = '<span class="dot" style="background:' + subject().color + '"></span><button data-go="' + n + '">Sayfa ' + n + '</button><button class="x" title="Kaldır">&times;</button>';
    $('[data-go]', b).addEventListener('click', () => goPage(n));
    $('.x', b).addEventListener('click', () => toggleMark(n));
    el.bmList.appendChild(b);
  });
}
function buildSubjects() {
  el.subjectList.innerHTML = '';
  el.subjectSeg.innerHTML = '';
  LIBRARY.forEach((s, i) => {
    const max = parseInt(STORE.get('max.' + s.key, '0'), 10) || 0;
    const b = document.createElement('button');
    b.className = 'sub' + (s.key === state.key ? ' on' : '');
    b.dataset.key = s.key;
    b.style.setProperty('--c', s.color);
    b.innerHTML = '<span class="ic">' + s.icon + '</span><span class="meta"><strong>' + s.title +
      '</strong><span>' + s.subtitle + '</span><span class="bar"><i style="width:' +
      Math.round(max / s.pages * 100) + '%"></i></span></span>' +
      '<span class="pc">' + max + '/' + s.pages + '</span>';
    b.addEventListener('click', () => selectSubject(s.key, false, true));
    el.subjectList.appendChild(b);
    const t = document.createElement('button');
    t.className = 'chip' + (s.key === state.key ? ' on' : '');
    t.dataset.key = s.key;
    t.textContent = (i + 1) + '. ' + s.title;
    t.addEventListener('click', () => selectSubject(s.key, false, true));
    el.subjectSeg.appendChild(t);
  });
}
let observer = null;
function buildPages() {
  const s = subject();
  el.pages.innerHTML = '';
  const oz = ozetOf(s.key);
  if (oz) {
    const ic = document.createElement('div');
    ic.className = 'intro-card';
    ic.innerHTML = '<h4>' + oz.baslik + '</h4><p>' + oz.giris + '</p>' +
      (oz.vurgu && oz.vurgu.length ? '<ul>' + oz.vurgu.map(v => '<li>' + v + '</li>').join('') + '</ul>' : '') +
      (oz.not ? '<div class="trick">' + oz.not + '</div>' : '') +
      '<div class="act"><button class="chip" id="introOzet">&#128221; Konu özetini aç</button>' +
      '<a class="chip" href="turkce-ozet.html">Tam sayfa özet &#8599;</a></div>';
    el.pages.appendChild(ic);
    $('#introOzet', ic).addEventListener('click', () => ozToggle(true));
  }
  const frag = document.createDocumentFragment();
  for (let n = 1; n <= s.pages; n++) {
    const d = document.createElement('article');
    d.className = 'page';
    d.dataset.n = n;
    d.innerHTML = '<img loading="lazy" decoding="async" alt="' + s.title + ' — sayfa ' + n + '">' +
      '<div class="pcap"><span>Sayfa ' + n + ' / ' + s.pages + '</span>' +
      '<button class="mk' + (isMarked(n) ? ' on' : '') + '" title="Ayraç (B)">&#128278; Ayraç</button></div>';
    $('.mk', d).addEventListener('click', () => toggleMark(n));
    frag.appendChild(d);
  }
  el.pages.appendChild(frag);
  if (observer) observer.disconnect();
  observer = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const box = en.target;
      const n = parseInt(box.dataset.n, 10);
      const img = $('img', box);
      const want = src(state.key, n);
      if (img.dataset.ld !== want) {
        img.dataset.ld = want;
        img.onload = () => img.classList.add('ready');
        img.onerror = () => img.classList.add('ready');
        img.src = want;
      }
      state.current = n;
      if (en.intersectionRatio > 0.55) {
        state.max = Math.max(state.max, n);
        STORE.set('max.' + state.key, String(state.max));
        STORE.set('sayfa.' + state.key, String(n));
        el.progress.style.width = (state.max / s.pages * 100) + '%';
      }
    });
  }, { rootMargin: '600px 0px', threshold: [0, 0.55, 1] });
  $$('.page', el.pages).forEach(p => observer.observe(p));
  $$('.page', el.pages).slice(0, 3).forEach(p => {
    const img = $('img', p);
    img.src = src(state.key, parseInt(p.dataset.n, 10));
    img.onload = () => img.classList.add('ready');
    img.onerror = () => img.classList.add('ready');
  });
}
function applyHeader() {
  const s = subject();
  document.documentElement.style.setProperty('--accent', s.color);
  el.subjDot.style.background = s.color;
  el.subjTitle.textContent = s.title;
  el.subjSub.textContent = s.subtitle + ' · ' + s.pages + ' sayfa';
  el.tailInfo.textContent = s.title + ' · ' + s.pages + ' sayfa';
  const i = LIBRARY.indexOf(s);
  $('#prevSub').disabled = i === 0;
  $('#nextSub').disabled = i === LIBRARY.length - 1;
  $('#btnClean').innerHTML = state.clean ? '&#10022; Temiz: açık' : '&#10022; Temiz: kapalı';
  $('#btnClean').classList.toggle('on', state.clean);
  $('#btnOzet').hidden = !ozetOf(s.key);
  if (!el.ozDrawer.hidden && !ozetOf(s.key)) ozToggle(false);
}
function selectSubject(key, noscroll, push) {
  const first = !el.pages.children.length;
  try {
    var u = new URL(location.href);
    if (push) { u.searchParams.set('ders', key); history.replaceState(null, '', u); }
  } catch (e) {}
  state.key = key;
  STORE.set('ders', key);
  state.max = parseInt(STORE.get('max.' + key, '0'), 10) || 0;
  el.progress.style.width = (state.max / subject().pages * 100) + '%';
  applyHeader();
  buildSubjects();
  renderBm();
  buildPages();
  updateResume();
  if (!noscroll && !first) window.scrollTo(0, 0);
  syncLibBar();
}
/* Telefonda panel varsayilan olarak kapali gelsin. */
function syncLibBar() {
  if (window.matchMedia('(max-width: 920px)').matches) document.body.classList.add('no-lib');
}
window.addEventListener('resize', () => {
  if (window.matchMedia('(max-width: 920px)').matches) document.body.classList.add('no-lib');
  else document.body.classList.remove('no-lib');
});
function goPage(n) {
  const p = $('.page[data-n="' + n + '"]', el.pages);
  if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function updateResume() {
  const saved = parseInt(STORE.get('sayfa.' + state.key, '0'), 10) || 0;
  if (saved > 2) {
    el.resumeBtn.hidden = false;
    el.resumeBtn.innerHTML = '&#9654; Kaldığınız yer: <b>&nbsp;sayfa ' + saved + '</b>&nbsp;— devam et';
    el.resumeBtn.onclick = () => { goPage(saved); toast('Sayfa ' + saved + ' açıldı'); };
  } else el.resumeBtn.hidden = true;
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  STORE.set('tema', t);
  $('#btnTheme').innerHTML = t === 'dark' ? '&#9789;' : '&#9788;';
}
function setPaper(p) {
  document.documentElement.dataset.paper = p;
  STORE.set('kagit', p);
  $$('#paperSeg .chip').forEach(c => c.classList.toggle('on', c.dataset.paper === p));
}
function toggleClean() {
  state.clean = !state.clean;
  STORE.set('temiz', state.clean ? '1' : '0');
  applyHeader();
  const s = subject();
  $$('.page', el.pages).forEach(p => {
    const img = $('img', p);
    if (!img.src) return;
    img.dataset.ld = '';
    img.classList.remove('ready');
    img.src = src(s.key, parseInt(p.dataset.n, 10));
    img.onload = () => img.classList.add('ready');
    img.onerror = () => img.classList.add('ready');
  });
  toast(state.clean ? 'Temizlenmiş sayfalar' : 'Orijinal tarama');
}
function init() {
  setTheme(STORE.get('tema', 'dark'));
  setPaper(STORE.get('kagit', 'beyaz'));
  state.max = parseInt(STORE.get('max.' + state.key, '0'), 10) || 0;
  $('#widthRange').value = STORE.get('genislik', '860');
  document.documentElement.style.setProperty('--colw', $('#widthRange').value + 'px');
  $('#widthRange').addEventListener('input', e => {
    document.documentElement.style.setProperty('--colw', e.target.value + 'px');
    STORE.set('genislik', e.target.value);
  });
  $('#paperSeg').addEventListener('click', e => {
    const c = e.target.closest('.chip');
    if (c) setPaper(c.dataset.paper);
  });
  $('#btnClean').addEventListener('click', toggleClean);
  $('#btnOzet').addEventListener('click', () => ozToggle());
  $('#ozClose').addEventListener('click', () => ozToggle(false));
  $('#ozMask').addEventListener('click', () => ozToggle(false));
  $('#btnFocus').addEventListener('click', () => {
    document.body.classList.toggle('focus');
    $('#btnFocus').classList.toggle('on', document.body.classList.contains('focus'));
  });
  $('#btnTheme').addEventListener('click', () => {
    const nx = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    setTheme(nx);
    toast(nx === 'dark' ? 'Karanlık tema' : 'Aydınlık tema');
  });
  $('#btnLib').addEventListener('click', () => document.body.classList.toggle('no-lib'));
  $('#prevSub').addEventListener('click', () => {
    const i = LIBRARY.indexOf(subject());
    if (i > 0) selectSubject(LIBRARY[i - 1].key, false, true);
  });
  $('#nextSub').addEventListener('click', () => {
    const i = LIBRARY.indexOf(subject());
    if (i < LIBRARY.length - 1) selectSubject(LIBRARY[i + 1].key, false, true);
  });
  document.addEventListener('keydown', e => {
    if (e.target instanceof HTMLInputElement) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    switch (e.key) {
      case 'b': case 'B': toggleMark(state.current); break;
      case 'c': case 'C': toggleClean(); break;
      case 'o': case 'O': $('#btnFocus').click(); break;
      case 'd': case 'D': $('#btnTheme').click(); break;
      case 'k': case 'K': $('#btnLib').click(); break;
      case 'ö': case 'Ö': ozToggle(); break;
      case 'Escape': ozToggle(false); break;
      case '1': case '2': case '3': case '4': {
        const s = LIBRARY[parseInt(e.key, 10) - 1];
        if (s) selectSubject(s.key, false, false);
        break;
      }
      default: return;
    }
    e.preventDefault();
  });
  applyHeader();
  syncLibBar();
  buildSubjects();
  renderBm();
  buildPages();
  updateResume();
  const saved = parseInt(STORE.get('sayfa.' + state.key, '0'), 10) || 0;
  if (saved > 2) setTimeout(() => goPage(saved), 500);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script></body>
</html>
